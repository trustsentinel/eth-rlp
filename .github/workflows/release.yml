name: Release

# Publishes to PyPI on a version tag (e.g. v0.1.0) via PyPI Trusted Publishing
# (OIDC) — no API token stored in the repo. One-time setup on PyPI: add a
# trusted publisher for this repo, workflow "release.yml", environment "pypi".
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
