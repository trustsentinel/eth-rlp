[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ethrlp"
version = "0.1.0"
description = "RLP codec for Ethereum discv4 node-discovery packets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TrustSentinel" }]
keywords = ["ethereum", "rlp", "discv4", "devp2p", "node-discovery"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://trustsentinel.eu"
Repository = "https://github.com/trustsentinel/eth-rlp"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["ethrlp"]
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
